[package]
name = "orbit"
version = "1.1.0"
description = "ORBIT — Ad-free offline desktop music player for Windows"
authors = ["Naitik Jain"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
