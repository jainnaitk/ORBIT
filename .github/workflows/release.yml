name: Release ORBIT Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Python backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          uv sync --group p1 --group p2 --group p3
          uv pip install --python .venv\Scripts\python.exe pyinstaller
          .\scripts\build_sidecar.ps1

      - name: Install UI dependencies & build Tauri NSIS/MSI installers
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npm run tauri build

      - name: Prepare stable ORBIT-Setup.exe & SHA256SUMS.txt
        shell: pwsh
        run: |
          $nsisDir = "ui/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found in $nsisDir" }
          Copy-Item $exe.FullName "$nsisDir/ORBIT-Setup.exe"
          $hash = (Get-FileHash "$nsisDir/ORBIT-Setup.exe" -Algorithm SHA256).Hash
          "$hash  $($exe.Name)`n$hash  ORBIT-Setup.exe" | Set-Content "$nsisDir/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
