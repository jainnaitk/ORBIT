name: Release ORBIT Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Python backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          uv sync --group p1 --group p2 --group p3
          uv pip install --python .venv\Scripts\python.exe pyinstaller
          .\scripts\build_sidecar.ps1

      - name: Install UI dependencies & build Tauri NSIS/MSI installers
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npm run tauri build

      - name: Prepare stable ORBIT-Setup.exe & SHA256SUMS.txt
        shell: pwsh
        run: |
          $nsisDir = "ui/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found in $nsisDir" }
          Copy-Item $exe.FullName "$nsisDir/ORBIT-Setup.exe"
          $hash = (Get-FileHash "$nsisDir/ORBIT-Setup.exe" -Algorithm SHA256).Hash
          "$hash  $($exe.Name)`n$hash  ORBIT-Setup.exe" | Set-Content "$nsisDir/SHA256SUMS.txt"

      - name: Generate Release Notes (2-4 bullet points)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          $bullets = New-Object System.Collections.Generic.List[string]

          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $inSection = $false
            foreach ($raw in $lines) {
              $line = $raw.Trim()
              if ($line -match '^##\s+v?([0-9]+\.[0-9]+\.[0-9]+.*)$') {
                if ($inSection) { break }
                if ($Matches[1].Trim() -eq $ver) { $inSection = $true }
                continue
              }
              if ($inSection -and $line -match '^[-*•]\s+(.+)$') {
                $bullets.Add("- $($Matches[1].Trim())")
                if ($bullets.Count -ge 4) { break }
              }
            }
          }

          if ($bullets.Count -eq 0) {
            $prevTag = (& git describe --tags --abbrev=0 --match "v*" "$tag^" 2>$null | Select-Object -First 1)
            $range = if ($prevTag) { "$prevTag..$tag" } else { "$tag" }
            $commits = @(& git log $range --pretty=format:"%s" 2>$null | Where-Object { $_ -and $_ -notmatch '^(Release v|Merge )' })
            foreach ($c in $commits) {
              $clean = ($c -replace '^(feat|fix|chore|refactor|perf|docs)(\([^)]+\))?:\s*', '').Trim()
              if ($clean.Length -ge 4) {
                $bullets.Add("- $clean")
              }
              if ($bullets.Count -ge 4) { break }
            }
          }

          if ($bullets.Count -lt 2) {
            if ($bullets.Count -eq 0) { $bullets.Add("- Updated ORBIT desktop app to $tag") }
            $bullets.Add("- Stability, UI, and auto-updater improvements")
          }

          ($bullets | Select-Object -First 4) -join "`n" | Set-Content "release_notes.md" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
