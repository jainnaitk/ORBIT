      setLoad(42, 'Synthesizing Earth Continents, Oceans, Clouds & City Lights...'); await yieldFrame();
      const earthTex = buildEarthTextures();

      setLoad(54, 'Mapping Mars Canyons & Polar Ice Caps...'); await yieldFrame();
      const marsTex = buildMarsTextures();

      setLoad(66, 'Simulating Jupiter Bands & Great Red Spot...'); await yieldFrame();
      const jupiterTex = buildJupiterTextures();

      setLoad(76, 'Crafting Saturn & Translucent Cassini Rings...'); await yieldFrame();
      const saturnTex = buildSaturnTextures();

      setLoad(84, 'Generating Uranus & Neptune Atmospheres...'); await yieldFrame();
      const uranusTex = buildIceGiantTextures(false);
      const neptuneTex = buildIceGiantTextures(true);

      setLoad(91, 'Synthesizing Major Moon Surfaces & Orbital Belts...'); await yieldFrame();
      const majorMoonTexCache = {
        moon: buildMajorMoonTextures('moon'),
        io: buildMajorMoonTextures('io'),
        europa: buildMajorMoonTextures('europa'),
        ganymede: buildMajorMoonTextures('ganymede'),
        callisto: buildMajorMoonTextures('callisto'),
        enceladus: buildMajorMoonTextures('enceladus'),
        titan: buildMajorMoonTextures('titan'),
        triton: buildMajorMoonTextures('triton')
      };

      const startAnomalies = [0, 0.5, 2.2, 4.1, 5.4, 1.3, 3.6, 5.1, 2.7];

      BODIES.slice(1).forEach((cfg, i) => {
        // Inclined & oriented orbital plane with Sun strictly at one focus
        const orbitPivot = new THREE.Group();
        orbitPivot.rotation.order = 'YXZ';
        orbitPivot.rotation.y = cfg.peri || 0;
        orbitPivot.rotation.z = cfg.incl || 0;
        scene.add(orbitPivot);

        const a = cfg.orbit;
        const e = cfg.ecc || 0;
        const b = a * Math.sqrt(1 - e * e);
        const c = a * e; // focal offset

        // Elliptical trajectory ring
        const pts = [];
        const segs = 200;
        for (let s = 0; s <= segs; s++) {
          const E = (s / segs) * Math.PI * 2;
          pts.push(new THREE.Vector3(a * Math.cos(E) - c, 0, b * Math.sin(E)));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const orbitMat = new THREE.LineBasicMaterial({
          color: 0x5c85b8,
          transparent: true,
          opacity: 0.23
        });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        orbitPivot.add(orbitLine);
        orbitLines.push(orbitLine);

        // Planet system root positioned on the elliptical orbit
        const systemRoot = new THREE.Group();
        const initM = startAnomalies[i + 1];
        const initE = solveKepler(initM, e);
        systemRoot.position.set(a * Math.cos(initE) - c, 0, b * Math.sin(initE));
        orbitPivot.add(systemRoot);

        // Axial tilt container
        const tiltGroup = new THREE.Group();
        tiltGroup.rotation.z = THREE.MathUtils.degToRad(cfg.tilt);
        systemRoot.add(tiltGroup);

        const sphereGeo = new THREE.SphereGeometry(cfg.radius, 64, 48);
        let mesh;

        if (cfg.id === 'earth') {
          earthMaterial = new THREE.ShaderMaterial({
            uniforms: {
              uDayMap: { value: earthTex.dayMap },
              uNightMap: { value: earthTex.nightMap },
              uSpecMap: { value: earthTex.specMap },
              uBumpMap: { value: earthTex.bumpMap },
              uAmbient: { value: 0.08 }
            },
            vertexShader: EARTH_VERT,
            fragmentShader: EARTH_FRAG
          });
          mesh = new THREE.Mesh(sphereGeo, earthMaterial);

          const cloudGeo = new THREE.SphereGeometry(cfg.radius * 1.015, 64, 48);
          const cloudMat = new THREE.MeshStandardMaterial({
            map: earthTex.cloudMap,
            transparent: true,
            opacity: 0.88,
            roughness: 0.9,
            depthWrite: false
          });
          const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
          tiltGroup.add(cloudMesh);
          cfg._cloudMesh = cloudMesh;
        } else {
          let matOpts = { roughness: 0.88, metalness: 0.02 };
          if (cfg.id === 'mercury') matOpts = { map: mercuryTex.map, bumpMap: mercuryTex.bumpMap, bumpScale: 0.06, roughness: 0.94 };
          if (cfg.id === 'venus')   matOpts = { map: venusTex.map, roughness: 0.72 };
          if (cfg.id === 'mars')    matOpts = { map: marsTex.map, bumpMap: marsTex.bumpMap, bumpScale: 0.055, roughness: 0.92 };
          if (cfg.id === 'jupiter') matOpts = { map: jupiterTex.map, roughness: 0.68 };
          if (cfg.id === 'saturn')  matOpts = { map: saturnTex.map, roughness: 0.68 };
          if (cfg.id === 'uranus')  matOpts = { map: uranusTex.map, roughness: 0.62 };
          if (cfg.id === 'neptune') matOpts = { map: neptuneTex.map, roughness: 0.62 };
          mesh = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial(matOpts));
        }

        if (cfg.oblate) mesh.scale.set(1, cfg.oblate, 1);
        mesh.userData.bodyId = cfg.id;
        tiltGroup.add(mesh);
        clickableMeshes.push(mesh);

        // Fixed BackSide Rayleigh Atmospheric Halo
        if (cfg.atmo) {
          tiltGroup.add(createAtmosphereMesh(cfg.radius, cfg.atmo, cfg.oblate));
        }

        // Saturn Multi-Band Shadowed Rings
        if (cfg.hasRings) {
          const innerR = cfg.radius * 1.28;
          const outerR = cfg.radius * 2.52;
          const ringGeo = new THREE.RingGeometry(innerR, outerR, 128, 1);
          saturnRingMaterial = new THREE.ShaderMaterial({
            uniforms: {
              uRingMap: { value: saturnTex.ringMap },
              uInnerR: { value: innerR },
              uOuterR: { value: outerR },
              uPlanetPos: { value: new THREE.Vector3() },
              uPlanetRadius: { value: cfg.radius * 0.96 }
            },
            vertexShader: RING_VERT,
            fragmentShader: RING_FRAG,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          const ringMesh = new THREE.Mesh(ringGeo, saturnRingMaterial);
          ringMesh.rotation.x = Math.PI / 2;
          tiltGroup.add(ringMesh);
        }

        // Uranus Delicate Rings
        if (cfg.hasFaintRings) {
          const uRingGeo = new THREE.RingGeometry(cfg.radius * 1.48, cfg.radius * 1.92, 96);
          const uRingMat = new THREE.MeshBasicMaterial({
            color: 0xaadbe8,
            transparent: true,
            opacity: 0.16,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          const uRing = new THREE.Mesh(uRingGeo, uRingMat);
          uRing.rotation.x = Math.PI / 2;
          tiltGroup.add(uRing);
        }

        // Interactive Major Moons (clickable, trackable, procedural textures)
        const moons = [];
        if (cfg.majorMoons) {
          cfg.majorMoons.forEach((mCfg, mIdx) => {
            const mOrbitPivot = new THREE.Group();
            mOrbitPivot.rotation.z = mCfg.incl || 0;
            systemRoot.add(mOrbitPivot);

            // Delicate moon orbital path
            const mPts = [];
            for (let s = 0; s <= 96; s++) {
              const ang = (s / 96) * Math.PI * 2;
              mPts.push(new THREE.Vector3(Math.cos(ang) * mCfg.dist, 0, Math.sin(ang) * mCfg.dist));
            }
            const mOrbitLine = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints(mPts),
              new THREE.LineBasicMaterial({ color: 0x7aa4d6, transparent: true, opacity: 0.17 })
            );
            mOrbitPivot.add(mOrbitLine);
            orbitLines.push(mOrbitLine);

            const mTex = majorMoonTexCache[mCfg.id];
            const mGeo = new THREE.SphereGeometry(mCfg.radius, 36, 28);
            const mMat = new THREE.MeshStandardMaterial({
              map: mTex.map,
              bumpMap: mTex.bumpMap,
              bumpScale: mCfg.id === 'titan' ? 0.0 : 0.032,
              roughness: mCfg.id === 'enceladus' || mCfg.id === 'europa' ? 0.58 : 0.92,
              metalness: 0.02
            });
            const mMesh = new THREE.Mesh(mGeo, mMat);
            const initAng = (mIdx * 1.7 + i * 0.9) % (Math.PI * 2);
            mMesh.position.set(Math.cos(initAng) * mCfg.dist, 0, Math.sin(initAng) * mCfg.dist);
            mMesh.userData.bodyId = mCfg.id;
            mOrbitPivot.add(mMesh);
            clickableMeshes.push(mMesh);

            if (mCfg.atmo) {
              mMesh.add(createAtmosphereMesh(mCfg.radius, mCfg.atmo, null));
            }

            moons.push({
              id: mCfg.id,
              mesh: mMesh,
              dist: mCfg.dist,
              speed: mCfg.speed,
              rotSpeed: mCfg.rotSpeed,
              angle: initAng
            });

            bodyMap.set(mCfg.id, {
              cfg: { ...mCfg, isMoon: true, parentId: cfg.id, parentName: cfg.name },
              mesh: mMesh,
              isMoon: true,
              parentId: cfg.id,
              prevWorld: new THREE.Vector3()
            });
          });
        }

        // Minor decorative moons (Phobos, Deimos)
        if (cfg.minorMoons) {
          cfg.minorMoons.forEach((mm, idx) => {
            const mMesh = new THREE.Mesh(
              new THREE.DodecahedronGeometry(mm.r, 1),
              new THREE.MeshStandardMaterial({ color: mm.color, roughness: 0.94 })
            );
            const initAng = idx * 2.5 + 0.6;
            mMesh.position.set(Math.cos(initAng) * mm.dist, 0, Math.sin(initAng) * mm.dist);
            systemRoot.add(mMesh);
            moons.push({
              id: null,
              mesh: mMesh,
              dist: mm.dist,
              speed: mm.speed,
              rotSpeed: 0.9,
              angle: initAng
            });
          });
        }

        bodyMap.set(cfg.id, {
          cfg,
          orbitPivot,
          systemRoot,
          tiltGroup,
          mesh,
          moons,
          isMoon: false,
          semiMajor: a,
          semiMinor: b,
          focalOffset: c,
          ecc: e,
          meanAnomaly: initM,
          prevWorld: new THREE.Vector3()
        });
      });

      // Belts & Comet
      asteroidBelt = createBelt(2200, 74, 88, 3.6, 0.09, 0.34, 0x8f877d);
      kuiperBelt = createBelt(1400, 236, 280, 11.0, 0.14, 0.44, 0x6f849c, 0.65);
      comet = createComet();

      buildUI();
      setLoad(100, 'Ready');
      await yieldFrame();
      loaderEl.classList.add('hidden');
      animate();
    }

    // =========================================================================
    // INTERACTIVE HUD, CAMERA FLIGHT & TRACKING
    // =========================================================================
    let isPaused = false;
    let timeScale = 1.0;
    let showOrbits = true;
    let showLabels = true;
    let showBelts = true;
    let bloomEnabled = true;
    let trueDark = false;
    let simDays = 0;

    let focusedId = null;
    let cameraFlight = null;

    const infoPanel = document.getElementById('info-panel');
    const infoType = document.getElementById('info-type');
    const infoName = document.getElementById('info-name');
    const infoDesc = document.getElementById('info-desc');
    const infoGrid = document.getElementById('info-grid');
    const infoRelated = document.getElementById('info-related');
    const relatedTitle = document.getElementById('related-title');
    const relatedChips = document.getElementById('related-chips');
    const focusStatus = document.getElementById('focus-status');
    const simDateEl = document.getElementById('sim-date');
    const statusDot = document.getElementById('status-dot');
    const dockEl = document.getElementById('planet-dock');
    const labelsLayer = document.getElementById('labels-layer');

    function buildUI() {
      const ovBtn = document.createElement('button');
      ovBtn.className = 'planet-btn active';
      ovBtn.dataset.id = 'overview';
      ovBtn.innerHTML = `<span class="swatch" style="background:linear-gradient(135deg,#6cb8ff,#ffb35c)"></span>Overview`;
      ovBtn.addEventListener('click', () => focusOverview());
      dockEl.appendChild(ovBtn);

      BODIES.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'planet-btn';
        btn.dataset.id = b.id;
        btn.innerHTML = `<span class="swatch" style="background:${b.color};box-shadow:0 0 6px ${b.color}"></span>${b.name}`;
        btn.addEventListener('click', () => focusBody(b.id));
        dockEl.appendChild(btn);

        const lbl = document.createElement('div');
        lbl.className = 'planet-label';
        lbl.textContent = b.name;
        lbl.addEventListener('click', () => focusBody(b.id));
        labelsLayer.appendChild(lbl);
        labelElements.push({ id: b.id, el: lbl, isMoon: false, parentId: null });

        if (b.majorMoons) {
          b.majorMoons.forEach(m => {
            const mLbl = document.createElement('div');
            mLbl.className = 'planet-label moon-label';
            mLbl.textContent = m.name;
            mLbl.style.opacity = '0';
            mLbl.style.pointerEvents = 'none';
            mLbl.addEventListener('click', () => focusBody(m.id));
            labelsLayer.appendChild(mLbl);
            labelElements.push({ id: m.id, el: mLbl, isMoon: true, parentId: b.id });
          });
        }
      });

      const playBtn = document.getElementById('btn-play');
      const togglePlay = () => {
        isPaused = !isPaused;
        playBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        statusDot.classList.toggle('paused', isPaused);
      };
      playBtn.addEventListener('click', togglePlay);

      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');
      speedSlider.addEventListener('input', e => {
        timeScale = parseFloat(e.target.value);
        speedVal.textContent = `${timeScale.toFixed(1)}x`;
      });

      const orbitsBtn = document.getElementById('btn-orbits');
      orbitsBtn.addEventListener('click', () => {
        showOrbits = !showOrbits;
        orbitsBtn.classList.toggle('active', showOrbits);
        orbitLines.forEach(l => (l.visible = showOrbits));
      });

      const labelsBtn = document.getElementById('btn-labels');
      labelsBtn.addEventListener('click', () => {
        showLabels = !showLabels;
        labelsBtn.classList.toggle('active', showLabels);
        labelsLayer.style.display = showLabels ? 'block' : 'none';
      });

      const beltsBtn = document.getElementById('btn-belts');
      beltsBtn.addEventListener('click', () => {
        showBelts = !showBelts;
        beltsBtn.classList.toggle('active', showBelts);
        if (asteroidBelt) asteroidBelt.visible = showBelts;
        if (kuiperBelt) kuiperBelt.visible = showBelts;
      });

      const bloomBtn = document.getElementById('btn-bloom');
      bloomBtn.addEventListener('click', () => {
        bloomEnabled = !bloomEnabled;
        bloomBtn.classList.toggle('active', bloomEnabled);
      });

      const shadowBtn = document.getElementById('btn-shadow');
      shadowBtn.addEventListener('click', () => {
        trueDark = !trueDark;
        shadowBtn.classList.toggle('active', trueDark);
        ambientLight.intensity = trueDark ? 0.04 : 0.36;
        if (earthMaterial) earthMaterial.uniforms.uAmbient.value = trueDark ? 0.015 : 0.08;
      });

      const hud = document.getElementById('hud');
      const toggleHud = () => hud.classList.toggle('hud-hidden');
      document.getElementById('btn-hide').addEventListener('click', toggleHud);
      document.getElementById('unhide-btn').addEventListener('click', toggleHud);
      document.getElementById('info-close').addEventListener('click', () => infoPanel.classList.remove('visible'));

      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        else if (e.key.toLowerCase() === 'h') toggleHud();
        else if (e.key === '0' || e.key === 'Escape') focusOverview();
        else if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (BODIES[idx]) focusBody(BODIES[idx].id);
        }
      });

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', e => {
        downPos = { x: e.clientX, y: e.clientY };
      });
      renderer.domElement.addEventListener('pointerup', e => {
        const move = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        if (move > 6) return;
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0 && hits[0].object.userData.bodyId) {
          focusBody(hits[0].object.userData.bodyId);
        }
      });
    }

    function setActiveDock(id) {
      dockEl.querySelectorAll('.planet-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    function getBodyWorldPos(id, out = new THREE.Vector3()) {
      const entry = bodyMap.get(id);
      if (!entry) return out.set(0, 0, 0);
      entry.mesh.getWorldPosition(out);
      return out;
    }

    function focusOverview() {
      focusedId = null;
      setActiveDock('overview');
      infoPanel.classList.remove('visible');
      focusStatus.textContent = 'SYSTEM OVERVIEW';
      cameraFlight = {
        startTime: performance.now(),
        duration: 1150,
        startCam: camera.position.clone(),
        startTgt: controls.target.clone(),
        endCam: new THREE.Vector3(0, 94, 204),
        endTgt: new THREE.Vector3(0, 0, 0),
        trackId: null
      };
    }

    function focusBody(id) {
      const entry = bodyMap.get(id);
      if (!entry) return;
      focusedId = id;
      setActiveDock(entry.isMoon ? entry.parentId : id);

      const cfg = entry.cfg;
      focusStatus.textContent = `TRACKING // ${cfg.name.toUpperCase()}`;
      infoType.textContent = cfg.type;
      infoName.textContent = cfg.name;
      infoDesc.textContent = cfg.desc;
      infoGrid.innerHTML = cfg.stats.map(([k, v]) => `
        <div class="metric">
          <span class="metric-label">${k}</span>
          <span class="metric-value">${v}</span>
        </div>
      `).join('');

      // Populate related moons (for planets) or parent link + sibling moons (for moons)
      relatedChips.innerHTML = '';
      if (cfg.majorMoons && cfg.majorMoons.length > 0) {
        relatedTitle.textContent = 'Major Moons — Click to Track';
        cfg.majorMoons.forEach(m => {
          const chip = document.createElement('button');
          chip.className = 'moon-chip';
          chip.innerHTML = `<span class="swatch" style="background:${m.color}"></span>${m.name}`;
          chip.addEventListener('click', () => focusBody(m.id));
          relatedChips.appendChild(chip);
        });
        infoRelated.classList.add('has-items');
      } else if (entry.isMoon && entry.parentId) {
        const parentEntry = bodyMap.get(entry.parentId);
        relatedTitle.textContent = 'System Navigation';
        const backChip = document.createElement('button');
        backChip.className = 'moon-chip';
        backChip.innerHTML = `← ${cfg.parentName}`;
        backChip.addEventListener('click', () => focusBody(entry.parentId));
        relatedChips.appendChild(backChip);

        if (parentEntry && parentEntry.cfg.majorMoons) {
          parentEntry.cfg.majorMoons.forEach(m => {
            if (m.id === id) return;
            const chip = document.createElement('button');
            chip.className = 'moon-chip';
            chip.innerHTML = `<span class="swatch" style="background:${m.color}"></span>${m.name}`;
            chip.addEventListener('click', () => focusBody(m.id));
            relatedChips.appendChild(chip);
          });
        }
        infoRelated.classList.add('has-items');
      } else {
        infoRelated.classList.remove('has-items');
      }

      infoPanel.classList.add('visible');

      const worldPos = getBodyWorldPos(id);
      entry.prevWorld.copy(worldPos);

      const distMult = cfg.id === 'sun' ? 3.2 : (cfg.hasRings ? 4.4 : (entry.isMoon ? 5.2 : 3.9));
      const minDist = entry.isMoon ? 1.45 : 5.2;
      const dist = Math.max(cfg.radius * distMult, minDist);
      const radialDir = worldPos.lengthSq() > 1 ? worldPos.clone().normalize() : new THREE.Vector3(0, 0, 1);
      const sideDir = new THREE.Vector3(-radialDir.z, 0.36, radialDir.x).normalize();
      const offset = sideDir.multiplyScalar(dist * 0.78).add(radialDir.clone().multiplyScalar(-dist * 0.58));
      offset.y = dist * 0.34;

      cameraFlight = {
        startTime: performance.now(),
        duration: 1050,
        startCam: camera.position.clone(),
        startTgt: controls.target.clone(),
        offset,
        trackId: id
      };
    }

    // =========================================================================
    // MAIN REAL-TIME SIMULATION LOOP (100% FRAME-RATE INDEPENDENT)
    // =========================================================================
    const clock = new THREE.Clock();
    const tmpVec = new THREE.Vector3();
    const tmpParentVec = new THREE.Vector3();
    const tmpDelta = new THREE.Vector3();
    const projVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const simDt = isPaused ? 0 : dt * timeScale;

      if (sunMaterial) sunMaterial.uniforms.uTime.value += dt * (isPaused ? 0.25 : 0.75);
      if (starShaderMat) starShaderMat.uniforms.uTime.value += dt;

      if (simDt > 0) {
        simDays += simDt * 18.5;
        const yr = (2026.88 + simDays / 365.25).toFixed(2);
        simDateEl.textContent = `EPOCH ${yr}`;
      }

      // Frame-rate independent Sun axial rotation
      const sunEntry = bodyMap.get('sun');
      if (sunEntry) {
        const sunRotDt = isPaused ? dt * 0.15 : (dt * 0.4 + simDt * 0.6);
        sunEntry.mesh.rotation.y += sunEntry.cfg.rotSpeed * sunRotDt;
      }

      // Update elliptical planet orbits, frame-rate independent axial rotations & moons
      bodyMap.forEach((entry, id) => {
        if (id === 'sun' || entry.isMoon) return;
        const { cfg, systemRoot, mesh, moons } = entry;

        if (simDt > 0) {
          entry.meanAnomaly += cfg.speed * simDt * 0.32;
          const E = solveKepler(entry.meanAnomaly, entry.ecc);
          systemRoot.position.set(
            entry.semiMajor * Math.cos(E) - entry.focalOffset,
            0,
            entry.semiMinor * Math.sin(E)
          );

          const spinDt = dt * 0.4 + simDt * 0.6;
          mesh.rotation.y += cfg.rotSpeed * spinDt;
          if (cfg._cloudMesh) cfg._cloudMesh.rotation.y += cfg.rotSpeed * 1.18 * spinDt;

          for (let m = 0; m < moons.length; m++) {
            const moon = moons[m];
            moon.angle += moon.speed * simDt * 0.85;
            moon.mesh.position.set(
              Math.cos(moon.angle) * moon.dist,
              0,
              Math.sin(moon.angle) * moon.dist
            );
            moon.mesh.rotation.y += moon.rotSpeed * spinDt;
          }
        }

        if (id === 'saturn' && saturnRingMaterial) {
          mesh.getWorldPosition(saturnRingMaterial.uniforms.uPlanetPos.value);
        }
      });

      if (asteroidBelt && simDt > 0) asteroidBelt.rotation.y += simDt * 0.018;
      if (kuiperBelt && simDt > 0) kuiperBelt.rotation.y += simDt * 0.005;

      if (comet) {
        if (simDt > 0) comet.angle += simDt * 0.14;
        const cx = Math.cos(comet.angle) * 145 - 88;
        const cz = Math.sin(comet.angle) * 82;
        const cy = Math.sin(comet.angle) * 32;
        comet.group.position.set(cx, cy, cz);
        comet.tail.lookAt(cx * 2, cy * 2, cz * 2);
      }

      // Smooth Camera Flight OR Lock-On Orbital Tracking (Planets & Moons)
      if (cameraFlight) {
        const elapsed = performance.now() - cameraFlight.startTime;
        const t = clamp01(elapsed / cameraFlight.duration);
        const ease = 1 - Math.pow(1 - t, 3);

        let targetDest, camDest;
        if (cameraFlight.trackId) {
          targetDest = getBodyWorldPos(cameraFlight.trackId, tmpVec);
          camDest = targetDest.clone().add(cameraFlight.offset);
          const entry = bodyMap.get(cameraFlight.trackId);
          if (entry) entry.prevWorld.copy(targetDest);
        } else {
          targetDest = cameraFlight.endTgt;
          camDest = cameraFlight.endCam;
        }

        controls.target.lerpVectors(cameraFlight.startTgt, targetDest, ease);
        camera.position.lerpVectors(cameraFlight.startCam, camDest, ease);

        if (t >= 1) cameraFlight = null;
      } else if (focusedId) {
        const entry = bodyMap.get(focusedId);
        if (entry) {
          getBodyWorldPos(focusedId, tmpVec);
          tmpDelta.subVectors(tmpVec, entry.prevWorld);
          camera.position.add(tmpDelta);
          controls.target.add(tmpDelta);
          entry.prevWorld.copy(tmpVec);
        }
      }

      controls.update();

      // Update projected 3D HUD labels (major moon labels appear when near or tracking their host planet)
      if (showLabels) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const focusedEntry = focusedId ? bodyMap.get(focusedId) : null;
        const activeSystemId = focusedEntry ? (focusedEntry.isMoon ? focusedEntry.parentId : focusedId) : null;

        for (let i = 0; i < labelElements.length; i++) {
          const item = labelElements[i];
          const entry = bodyMap.get(item.id);
          if (!entry) continue;

          if (item.isMoon) {
            let showThisMoon = activeSystemId === item.parentId;
            if (!showThisMoon && item.parentId) {
              const pEntry = bodyMap.get(item.parentId);
              if (pEntry) {
                pEntry.mesh.getWorldPosition(tmpParentVec);
                if (camera.position.distanceTo(tmpParentVec) < Math.max(pEntry.cfg.radius * 9.5, 22)) {
                  showThisMoon = true;
                }
              }
            }
            if (!showThisMoon || focusedId === item.id) {
              item.el.style.opacity = '0';
              item.el.style.pointerEvents = 'none';
              continue;
            }
          }

          entry.mesh.getWorldPosition(projVec);
          projVec.y += entry.cfg.radius * (item.isMoon ? 1.65 : 1.25);
          projVec.project(camera);

          const isBehind = projVec.z > 1.0;
          const isCloseFocus = focusedId === item.id;
          if (isBehind || isCloseFocus) {
            item.el.style.opacity = '0';
            item.el.style.pointerEvents = 'none';
          } else {
            const sx = (projVec.x * 0.5 + 0.5) * w;
            const sy = (-projVec.y * 0.5 + 0.5) * h;
            item.el.style.left = `${sx}px`;
            item.el.style.top = `${sy}px`;
            item.el.style.opacity = item.isMoon ? '0.84' : '0.9';
            item.el.style.pointerEvents = 'auto';
          }
        }
      }

      if (bloomEnabled) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = Math.min(window.devicePixelRatio, 2);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(pr);
      renderer.setSize(w, h);
      composer.setPixelRatio(pr);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
      if (starShaderMat) starShaderMat.uniforms.uPixelRatio.value = pr;
    });

    buildSolarSystem();
  </script>
</body>
</html>
