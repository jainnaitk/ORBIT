<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System — Hyper-Realistic 3D Simulation</title>
  <style>
    :root {
      --bg-glass: rgba(8, 12, 22, 0.72);
      --border-glass: rgba(148, 185, 255, 0.16);
      --border-active: rgba(130, 195, 255, 0.65);
      --text-main: #eef4ff;
      --text-dim: #8b9bb8;
      --accent: #6cb8ff;
      --accent-warm: #ffb35c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000003;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Loading Overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #080d1a 0%, #000003 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(108, 184, 255, 0.15);
      border-top-color: var(--accent);
      border-right-color: var(--accent-warm);
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-main);
      font-weight: 500;
      text-align: center;
      padding: 0 16px;
    }

    .loader-bar-wrap {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    #loader-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-warm));
      transition: width 0.2s ease;
    }

    #loader-status {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-align: center;
      padding: 0 16px;
    }

    /* HUD Wrapper */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #hud.hud-hidden > *:not(#unhide-btn) {
      opacity: 0;
      pointer-events: none !important;
    }

    /* Top Left Header */
    .top-left {
      position: absolute;
      top: 18px;
      left: 20px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 280px;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 14px rgba(108, 184, 255, 0.45);
      white-space: nowrap;
    }

    .sim-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .dot-live.paused {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    /* Top Right Controls */
    .top-right {
      position: absolute;
      top: 16px;
      right: 20px;
      pointer-events: auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      max-width: calc(100vw - 320px);
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      padding: 7px 10px;
      border-radius: 14px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ctrl-btn:hover {
      background: rgba(108, 184, 255, 0.16);
      border-color: rgba(108, 184, 255, 0.4);
    }

    .ctrl-btn.active {
      background: rgba(108, 184, 255, 0.22);
      border-color: var(--border-active);
      color: #fff;
    }

    .speed-group {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .speed-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 76px;
      height: 3px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(108, 184, 255, 0.8);
      cursor: pointer;
    }

    /* Info Panel */
    #info-panel {
      position: absolute;
      top: 82px;
      right: 20px;
      width: 316px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 18px 20px;
      pointer-events: auto;
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 185, 255, 0.25) transparent;
    }

    #info-panel.visible {
      transform: translateX(0);
      opacity: 1;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

    .info-type {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .info-name {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .info-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
    }

    .info-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .info-desc {
      font-size: 12.5px;
      line-height: 1.55;
      color: #c5d2e8;
      margin-bottom: 14px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
    }

    .metric-value {
      font-size: 12.5px;
      font-weight: 500;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .info-related {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .info-related.has-items {
      display: flex;
    }

    .related-title {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-dim);
    }

    .related-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .moon-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(148, 185, 255, 0.22);
      color: #dbe8ff;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .moon-chip:hover {
      background: rgba(108, 184, 255, 0.2);
      border-color: var(--border-active);
      color: #fff;
    }

    /* Bottom Navigation Dock */
    .bottom-dock {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      padding: 6px 8px;
      border-radius: 16px;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .bottom-dock::-webkit-scrollbar,
    .top-right::-webkit-scrollbar {
      display: none;
    }

    .planet-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #b7c6de;
      font-size: 11.5px;
      font-weight: 500;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .planet-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .planet-btn.active {
      background: rgba(108, 184, 255, 0.18);
      border-color: var(--border-active);
      color: #fff;
      box-shadow: 0 0 14px rgba(108, 184, 255, 0.18);
    }

    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Floating 3D Labels */
    #labels-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .planet-label {
      position: absolute;
      transform: translate(-50%, -155%);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(235, 244, 255, 0.85);
      background: rgba(5, 9, 18, 0.58);
      border: 1px solid rgba(148, 185, 255, 0.22);
      padding: 3px 7px;
      border-radius: 6px;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .planet-label.moon-label {
      font-size: 9px;
      padding: 2px 6px;
      border-color: rgba(175, 210, 255, 0.26);
      color: rgba(210, 228, 255, 0.88);
    }

    .planet-label:hover {
      background: rgba(22, 42, 78, 0.88);
      border-color: var(--accent);
      color: #fff;
    }

    .hint-bar {
      position: absolute;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      color: rgba(175, 195, 225, 0.52);
      letter-spacing: 0.06em;
      pointer-events: none;
      white-space: nowrap;
    }

    #unhide-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #hud.hud-hidden #unhide-btn {
      opacity: 0.72;
      pointer-events: auto;
    }

    #hud.hud-hidden #unhide-btn:hover {
      opacity: 1;
    }

    /* =====================================================================
       RESPONSIVE BREAKPOINTS — PREVENT OVERLAP ON SMALLER VIEWPORTS
       ===================================================================== */
    @media (max-width: 1260px) {
      .top-left {
        top: 14px;
        left: 16px;
        max-width: 240px;
      }
      .top-right {
        top: 14px;
        right: 16px;
        max-width: calc(100vw - 270px);
        padding: 6px 8px;
        gap: 5px;
      }
      .ctrl-btn {
        font-size: 10.5px;
        padding: 5px 8px;
      }
      input[type="range"] {
        width: 64px;
      }
      #info-panel {
        top: 112px;
        right: 16px;
        width: 292px;
        max-height: calc(100vh - 200px);
      }
    }

    @media (max-width: 860px) {
      .top-left {
        top: 10px;
        left: 12px;
        right: 12px;
        max-width: none;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .brand {
        font-size: 11.5px;
        letter-spacing: 0.18em;
      }
      .sim-meta {
        font-size: 10px;
      }
      .top-right {
        top: 40px;
        left: 12px;
        right: 12px;
        max-width: none;
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        padding: 6px 8px;
        border-radius: 12px;
      }
      #info-panel {
        top: 94px;
        right: 12px;
        width: min(304px, calc(100vw - 24px));
        max-height: calc(100vh - 170px);
        padding: 14px 16px;
      }
      .hint-bar {
        display: none;
      }
      .bottom-dock {
        bottom: 12px;
        max-width: calc(100vw - 24px);
        padding: 5px 6px;
        border-radius: 14px;
      }
      .planet-btn {
        font-size: 11px;
        padding: 6px 9px;
      }
      #unhide-btn {
        top: 10px;
        right: 12px;
      }
    }

    @media (max-width: 540px) {
      .top-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .top-right {
        top: 52px;
      }
      #info-panel {
        top: 106px;
        left: 12px;
        right: 12px;
        width: auto;
        max-height: calc(100vh - 176px);
        transform: translateY(-16px);
      }
      #info-panel.visible {
        transform: translateY(0);
      }
      .info-name {
        font-size: 20px;
      }
      .info-desc {
        font-size: 12px;
        margin-bottom: 10px;
      }
    }

    @media (max-height: 620px) {
      .hint-bar {
        display: none;
      }
      #info-panel {
        max-height: calc(100vh - 156px);
        padding: 12px 14px;
      }
      .bottom-dock {
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-title">Synthesizing Planetary Surfaces</div>
    <div class="loader-bar-wrap"><div id="loader-bar"></div></div>
    <div id="loader-status">Initializing WebGL2 Engine...</div>
  </div>

  <div id="canvas-container"></div>
  <div id="labels-layer"></div>

  <div id="hud">
    <div class="top-left">
      <div class="brand">HELIOS // SOLAR SYSTEM</div>
      <div class="sim-meta">
        <span class="dot-live" id="status-dot"></span>
        <span id="sim-date">EPOCH 2026.88</span>
        <span>•</span>
        <span id="focus-status">SYSTEM OVERVIEW</span>
      </div>
    </div>

    <div class="top-right">
      <button class="ctrl-btn" id="btn-play" title="Space">⏸ Pause</button>
      <div class="speed-group">
        <span class="speed-label" id="speed-val">1.0x</span>
        <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" />
      </div>
      <button class="ctrl-btn active" id="btn-orbits">Orbits</button>
      <button class="ctrl-btn active" id="btn-labels">Labels</button>
      <button class="ctrl-btn active" id="btn-belts">Belts</button>
      <button class="ctrl-btn active" id="btn-bloom">Bloom</button>
      <button class="ctrl-btn" id="btn-shadow">True Dark</button>
      <button class="ctrl-btn" id="btn-hide" title="Press H">HUD</button>
    </div>

    <button class="ctrl-btn" id="unhide-btn">Show HUD (H)</button>

    <div id="info-panel">
      <div class="info-header">
        <div>
          <div class="info-type" id="info-type">TERRESTRIAL PLANET</div>
          <div class="info-name" id="info-name">Earth</div>
        </div>
        <button class="info-close" id="info-close">&times;</button>
      </div>
      <div class="info-desc" id="info-desc"></div>
      <div class="info-grid" id="info-grid"></div>
      <div class="info-related" id="info-related">
        <div class="related-title" id="related-title">Major Moons</div>
        <div class="related-chips" id="related-chips"></div>
      </div>
    </div>

    <div class="hint-bar">Drag to Orbit • Scroll to Zoom • Click any Planet or Major Moon to Track • Keys 0–9 &amp; Space</div>

    <div class="bottom-dock" id="planet-dock"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // =========================================================================
    // FAST 3D SIMPLEX-STYLE GRADIENT NOISE FOR SEAMLESS SPHERICAL PLANET MAPS
    // =========================================================================
    class Noise3D {
      constructor(seed = 1337) {
        this.perm = new Uint8Array(512);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        let s = seed >>> 0;
        for (let i = 255; i > 0; i--) {
          s = (s * 1664525 + 1013904223) >>> 0;
          const j = s % (i + 1);
          const tmp = p[i];
          p[i] = p[j];
          p[j] = tmp;
        }
        for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
      }

      static fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      static lerp(a, b, t) { return a + t * (b - a); }
      static grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }

      noise(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        z -= Math.floor(z);
        const u = Noise3D.fade(x);
        const v = Noise3D.fade(y);
        const w = Noise3D.fade(z);
        const p = this.perm;
        const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
        const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;

        return Noise3D.lerp(
          Noise3D.lerp(
            Noise3D.lerp(Noise3D.grad(p[AA], x, y, z), Noise3D.grad(p[BA], x - 1, y, z), u),
            Noise3D.lerp(Noise3D.grad(p[AB], x, y - 1, z), Noise3D.grad(p[BB], x - 1, y - 1, z), u),
            v
          ),
          Noise3D.lerp(
            Noise3D.lerp(Noise3D.grad(p[AA + 1], x, y, z - 1), Noise3D.grad(p[BA + 1], x - 1, y, z - 1), u),
            Noise3D.lerp(Noise3D.grad(p[AB + 1], x, y - 1, z - 1), Noise3D.grad(p[BB + 1], x - 1, y - 1, z - 1), u),
            v
          ),
          w
        );
      }

      fbm(x, y, z, octaves = 5, lacunarity = 2.05, gain = 0.5) {
        let sum = 0, amp = 0.5, freq = 1.0, norm = 0;
        for (let i = 0; i < octaves; i++) {
          sum += amp * this.noise(x * freq, y * freq, z * freq);
          norm += amp;
          freq *= lacunarity;
          amp *= gain;
        }
        return sum / norm;
      }

      ridged(x, y, z, octaves = 4) {
        let sum = 0, amp = 0.5, freq = 1.0, norm = 0;
        for (let i = 0; i < octaves; i++) {
          const n = 1.0 - Math.abs(this.noise(x * freq, y * freq, z * freq));
          sum += amp * n * n;
          norm += amp;
          freq *= 2.1;
          amp *= 0.5;
        }
        return sum / norm;
      }
    }

    const clamp01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);
    const mix = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp01((x - e0) / (e1 - e0));
      return t * t * (3 - 2 * t);
    };

    // Kepler's Equation solver: M = E - e * sin(E)
    function solveKepler(M, e) {
      let E = M;
      for (let k = 0; k < 4; k++) {
        E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      }
      return E;
    }

    function createCanvasTex(w, h, drawFn, isSRGB = true) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(w, h);
      drawFn(img.data, w, h, ctx);
      if (drawFn.length <= 3) ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      if (isSRGB) tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    function makeTexFromRGBA(arr, w, h, isSRGB = true) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.getContext('2d').putImageData(new ImageData(arr, w, h), 0, 0);
      const t = new THREE.CanvasTexture(c);
      if (isSRGB) t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      t.anisotropy = 8;
      return t;
    }

    // Iterate equirectangular pixels with 3D unit sphere coordinates (seam-free)
    function sampleSpherePixels(w, h, callback) {
      const cosPhiArr = new Float32Array(h);
      const sinPhiArr = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        const phi = ((y + 0.5) / h) * Math.PI;
        cosPhiArr[y] = Math.cos(phi);
        sinPhiArr[y] = Math.sin(phi);
      }
      const cosThetaArr = new Float32Array(w);
      const sinThetaArr = new Float32Array(w);
      for (let x = 0; x < w; x++) {
        const theta = (x / w) * Math.PI * 2;
        cosThetaArr[x] = Math.cos(theta);
        sinThetaArr[x] = Math.sin(theta);
      }
      for (let y = 0; y < h; y++) {
        const cy = cosPhiArr[y];
        const sy = sinPhiArr[y];
        const v = y / h;
        const rowOffset = y * w * 4;
        for (let x = 0; x < w; x++) {
          const sx = sy * cosThetaArr[x];
          const sz = sy * sinThetaArr[x];
          callback(rowOffset + x * 4, sx, cy, sz, x / w, v);
        }
      }
    }

    function makeCraters(count, seed) {
      let s = seed >>> 0;
      const rand = () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
      const craters = [];
      for (let i = 0; i < count; i++) {
        const u = rand() * 2 - 1;
        const th = rand() * Math.PI * 2;
        const r = Math.sqrt(1 - u * u);
        craters.push({
          x: r * Math.cos(th),
          y: u,
          z: r * Math.sin(th),
          rad: 0.035 + Math.pow(rand(), 3.2) * 0.22,
          depth: 0.4 + rand() * 0.6
        });
      }
      return craters;
    }

    // =========================================================================
    // PROCEDURAL HYPER-REALISTIC PLANETARY & MAJOR MOON TEXTURE SYNTHESIS
    // =========================================================================
    function buildMercuryTextures() {
      const n = new Noise3D(101);
      const craters = makeCraters(95, 777);
      const w = 512, h = 256;
      const colData = new Uint8ClampedArray(w * h * 4);
      const bumpData = new Uint8ClampedArray(w * h * 4);

      sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
        let hVal = n.fbm(sx * 3.5, sy * 3.5, sz * 3.5, 5) * 0.5 + 0.5;
        hVal += n.fbm(sx * 14, sy * 14, sz * 14, 3) * 0.14;

        let craterMod = 0;
        for (let i = 0; i < craters.length; i++) {
          const c = craters[i];
          const dx = sx - c.x, dy = sy - c.y, dz = sz - c.z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < c.rad * 1.45) {
            const rn = dist / c.rad;
            if (rn < 1.0) {
              craterMod -= (1.0 - rn * rn) * 0.34 * c.depth;
            } else {
              const rim = 1.0 - (rn - 1.0) / 0.45;
              craterMod += rim * rim * 0.16 * c.depth;
            }
          }
        }
        hVal = clamp01(hVal + craterMod);

        const base = 78 + hVal * 95;
        const warm = n.noise(sx * 2.2, sy * 2.2, sz * 2.2) * 10;
        colData[idx]     = clamp01((base + 8 + warm) / 255) * 255;
        colData[idx + 1] = clamp01((base + 3 + warm * 0.5) / 255) * 255;
        colData[idx + 2] = clamp01((base - 4) / 255) * 255;
        colData[idx + 3] = 255;

        const b = hVal * 255;
        bumpData[idx] = bumpData[idx + 1] = bumpData[idx + 2] = b;
        bumpData[idx + 3] = 255;
      });

      return {
        map: makeTexFromRGBA(colData, w, h, true),
        bumpMap: makeTexFromRGBA(bumpData, w, h, false)
      };
    }

    function buildVenusTextures() {
      const n = new Noise3D(202);
      const w = 768, h = 384;
      const map = createCanvasTex(w, h, (data, W, H) => {
        sampleSpherePixels(W, H, (idx, sx, sy, sz) => {
          const warp = n.fbm(sx * 2.3, sy * 2.3, sz * 2.3, 4) * 0.55;
          const swirl = n.fbm(sx * 3.8 + warp, sy * 7.5 + warp * 0.6, sz * 3.8 - warp, 5);
          const band = Math.sin(sy * 10.5 + swirl * 2.8) * 0.5 + 0.5;
          const streak = n.fbm(sx * 8.0, sy * 18.0 + swirl * 2.0, sz * 8.0, 3) * 0.5 + 0.5;
          const v = clamp01(band * 0.55 + streak * 0.45);

          data[idx]     = mix(178, 246, v);
          data[idx + 1] = mix(132, 214, v);
          data[idx + 2] = mix(72, 148, v * 0.9);
          data[idx + 3] = 255;
        });
      }, true);
      return { map };
    }

    function buildEarthTextures() {
      const nCont = new Noise3D(303);
      const nDetail = new Noise3D(304);
      const nCloud = new Noise3D(305);
      const w = 1024, h = 512;

      const dayData = new Uint8ClampedArray(w * h * 4);
      const nightData = new Uint8ClampedArray(w * h * 4);
      const specData = new Uint8ClampedArray(w * h * 4);
      const bumpData = new Uint8ClampedArray(w * h * 4);
      const cloudData = new Uint8ClampedArray(w * h * 4);

      sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
        const lat = Math.abs(sy);
        const warp = nDetail.fbm(sx * 2.2, sy * 2.2, sz * 2.2, 3) * 0.35;
        const elev = nCont.fbm(sx * 1.9 + warp, sy * 1.9 - warp * 0.5, sz * 1.9 + warp, 6);
        const ridge = nDetail.ridged(sx * 5.2, sy * 5.2, sz * 5.2, 4);
        const moisture = nDetail.fbm(sx * 3.1 + 4.0, sy * 3.1, sz * 3.1 - 3.0, 4) * 0.5 + 0.5;

        const seaLevel = 0.03;
        const iceCap = smoothstep(0.79, 0.91, lat + elev * 0.14);

        let r, g, b, spec = 0, bump = 0.25, city = 0;

        if (elev < seaLevel) {
          const depth = clamp01((seaLevel - elev) / 0.42);
          const shallow = 1.0 - smoothstep(0.0, 0.22, depth);
          r = mix(6, 22, shallow);
          g = mix(24, 92, shallow);
          b = mix(58, 134, shallow);
          spec = 0.92;
          bump = 0.18;
        } else {
          const hLand = clamp01((elev - seaLevel) / 0.55);
          const mountain = smoothstep(0.45, 0.85, hLand + ridge * 0.28);
          const desertWeight = smoothstep(0.55, 0.26, moisture) * (1.0 - smoothstep(0.45, 0.72, lat));

          let lr = mix(34, 72, hLand);
          let lg = mix(82, 110, moisture);
          let lb = mix(38, 48, hLand);

          lr = mix(lr, 186, desertWeight);
          lg = mix(lg, 154, desertWeight);
          lb = mix(lb, 104, desertWeight);

          lr = mix(lr, 118, mountain * 0.75);
          lg = mix(lg, 112, mountain * 0.75);
          lb = mix(lb, 108, mountain * 0.75);

          const alpineSnow = smoothstep(0.72, 0.94, hLand + ridge * 0.32);
          lr = mix(lr, 232, alpineSnow);
          lg = mix(lg, 238, alpineSnow);
          lb = mix(lb, 246, alpineSnow);

          r = lr; g = lg; b = lb;
          spec = 0.06;
          bump = clamp01(0.28 + hLand * 0.45 + ridge * 0.28);

          const coastal = 1.0 - smoothstep(0.0, 0.24, hLand);
          const habitable = (1.0 - desertWeight * 0.7) * (1.0 - smoothstep(0.58, 0.76, lat));
          const cluster = nDetail.fbm(sx * 16.0, sy * 16.0, sz * 16.0, 3);
          const sparkle = nCont.noise(sx * 48.0, sy * 48.0, sz * 48.0);
          if (cluster > 0.14 && sparkle > 0.15) {
            city = clamp01((cluster - 0.14) * 4.2 * habitable * (0.45 + coastal * 0.85));
          }
        }

        r = mix(r, 236, iceCap);
        g = mix(g, 244, iceCap);
        b = mix(b, 252, iceCap);
        spec = mix(spec, 0.28, iceCap);
        city *= (1.0 - iceCap);

        dayData[idx] = r; dayData[idx + 1] = g; dayData[idx + 2] = b; dayData[idx + 3] = 255;

        nightData[idx]     = city * 255;
        nightData[idx + 1] = city * 195;
        nightData[idx + 2] = city * 105;
        nightData[idx + 3] = 255;

        const sp = spec * 255;
        specData[idx] = specData[idx + 1] = specData[idx + 2] = sp; specData[idx + 3] = 255;

        const bp = bump * 255;
        bumpData[idx] = bumpData[idx + 1] = bumpData[idx + 2] = bp; bumpData[idx + 3] = 255;

        const cw = nCloud.fbm(sx * 2.5, sy * 2.5, sz * 2.5, 3) * 0.6;
        const cVal = nCloud.fbm(sx * 3.8 + cw, sy * 5.2 - cw * 0.4, sz * 3.8 + cw, 5);
        const cAlpha = smoothstep(0.06, 0.44, cVal) * 0.92;
        cloudData[idx] = 246;
        cloudData[idx + 1] = 250;
        cloudData[idx + 2] = 255;
        cloudData[idx + 3] = cAlpha * 255;
      });

      return {
        dayMap: makeTexFromRGBA(dayData, w, h, true),
        nightMap: makeTexFromRGBA(nightData, w, h, true),
        specMap: makeTexFromRGBA(specData, w, h, false),
        bumpMap: makeTexFromRGBA(bumpData, w, h, false),
        cloudMap: makeTexFromRGBA(cloudData, w, h, true)
      };
    }

    // Dedicated procedural maps for all 8 Major Moons
    function buildMajorMoonTextures(moonId) {
      const isLuna = moonId === 'moon';
      const w = isLuna ? 512 : 256;
      const h = isLuna ? 256 : 128;
      const col = new Uint8ClampedArray(w * h * 4);
      const bmp = new Uint8ClampedArray(w * h * 4);

      if (moonId === 'moon') {
        const n = new Noise3D(350);
        const craters = makeCraters(110, 912);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const maria = smoothstep(-0.08, 0.25, n.fbm(sx * 1.8, sy * 1.8, sz * 1.8, 4));
          let hVal = 0.45 + n.fbm(sx * 7.5, sy * 7.5, sz * 7.5, 4) * 0.22;
          for (let i = 0; i < craters.length; i++) {
            const c = craters[i];
            const dx = sx - c.x, dy = sy - c.y, dz = sz - c.z;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (dist < c.rad * 1.4) {
              const rn = dist / c.rad;
              hVal += rn < 1.0 ? -(1 - rn * rn) * 0.3 * c.depth : Math.pow(1 - (rn - 1) / 0.4, 2) * 0.14 * c.depth;
            }
          }
          hVal = clamp01(hVal);
          const lum = mix(72, 198, maria * 0.58 + hVal * 0.42);
          col[idx] = lum; col[idx + 1] = lum * 0.99; col[idx + 2] = lum * 0.96; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'io') {
        // Sulfurous volcanic world: vivid yellow/ochre plains, orange lava flows, dark calderas
        const n = new Noise3D(511);
        const calderas = makeCraters(32, 512);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const s1 = n.fbm(sx * 3.4, sy * 3.4, sz * 3.4, 4) * 0.5 + 0.5;
          const s2 = n.fbm(sx * 9.0, sy * 9.0, sz * 9.0, 3) * 0.5 + 0.5;
          let r = mix(198, 244, s1);
          let g = mix(154, 224, s1 * 0.8 + s2 * 0.2);
          let b = mix(46, 108, s2);
          let hVal = clamp01(s1 * 0.7 + s2 * 0.3);

          // Red-orange sulfur deposits
          const rust = smoothstep(0.62, 0.85, n.fbm(sx * 4.5 + 2.1, sy * 4.5, sz * 4.5, 3) * 0.5 + 0.5);
          r = mix(r, 212, rust * 0.8);
          g = mix(g, 92, rust * 0.8);
          b = mix(b, 38, rust * 0.8);

          // Dark silicate volcanic patera calderas
          for (let i = 0; i < calderas.length; i++) {
            const c = calderas[i];
            const dist = Math.hypot(sx - c.x, sy - c.y, sz - c.z);
            if (dist < c.rad * 0.75) {
              const k = smoothstep(c.rad * 0.75, c.rad * 0.2, dist);
              r = mix(r, 42, k * 0.9);
              g = mix(g, 28, k * 0.9);
              b = mix(b, 20, k * 0.9);
              hVal = clamp01(hVal - k * 0.35);
            }
          }
          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'europa') {
        // Bright water-ice crust laced with reddish-brown tectonic lineae fractures
        const n = new Noise3D(521);
        const nLine = new Noise3D(522);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const ice = n.fbm(sx * 3.0, sy * 3.0, sz * 3.0, 4) * 0.5 + 0.5;
          const ridge1 = Math.abs(nLine.fbm(sx * 5.2, sy * 5.2, sz * 5.2, 3));
          const ridge2 = Math.abs(nLine.fbm(sx * 9.5 + 3.0, sy * 9.5 - 2.0, sz * 9.5, 3));
          const crack = clamp01(smoothstep(0.065, 0.008, ridge1) * 0.9 + smoothstep(0.055, 0.008, ridge2) * 0.65);

          let r = mix(208, 240, ice);
          let g = mix(202, 232, ice);
          let b = mix(190, 224, ice);

          r = mix(r, 146, crack * 0.85);
          g = mix(g, 92, crack * 0.85);
          b = mix(b, 68, crack * 0.85);

          const hVal = clamp01(0.65 - crack * 0.45 + ice * 0.15);
          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'ganymede') {
        // Contrasting dark ancient cratered regolith + lighter grooved icy terrain
        const n = new Noise3D(531);
        const craters = makeCraters(65, 532);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const terrain = smoothstep(-0.1, 0.22, n.fbm(sx * 2.2, sy * 2.2, sz * 2.2, 4));
          const grooves = Math.sin((sx * 16 + sy * 12 + n.noise(sx * 4, sy * 4, sz * 4) * 2.5)) * 0.5 + 0.5;
          let hVal = clamp01(0.45 + terrain * 0.25 + grooves * terrain * 0.12);

          let brightRay = 0;
          for (let i = 0; i < craters.length; i++) {
            const c = craters[i];
            const dist = Math.hypot(sx - c.x, sy - c.y, sz - c.z);
            if (dist < c.rad * 1.4) {
              const rn = dist / c.rad;
              hVal += rn < 1.0 ? -(1 - rn * rn) * 0.24 * c.depth : Math.pow(1 - (rn - 1) / 0.4, 2) * 0.12 * c.depth;
              if (i < 10 && rn < 1.25) brightRay = Math.max(brightRay, (1 - rn / 1.25) * 0.7);
            }
          }
          hVal = clamp01(hVal);
          let r = mix(98, 178, terrain * 0.75 + grooves * 0.25);
          let g = mix(90, 170, terrain * 0.75 + grooves * 0.25);
          let b = mix(82, 160, terrain * 0.75 + grooves * 0.25);
          r = mix(r, 232, brightRay); g = mix(g, 230, brightRay); b = mix(b, 224, brightRay);

          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'callisto') {
        // Dark heavily-cratered ancient ice-rock surface speckled with bright icy impacts
        const n = new Noise3D(541);
        const craters = makeCraters(95, 542);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          let hVal = 0.42 + n.fbm(sx * 4.5, sy * 4.5, sz * 4.5, 4) * 0.2;
          let iceSpeck = 0;
          for (let i = 0; i < craters.length; i++) {
            const c = craters[i];
            const dist = Math.hypot(sx - c.x, sy - c.y, sz - c.z);
            if (dist < c.rad * 1.35) {
              const rn = dist / c.rad;
              hVal += rn < 1.0 ? -(1 - rn * rn) * 0.28 * c.depth : Math.pow(1 - (rn - 1) / 0.35, 2) * 0.14 * c.depth;
              if (rn < 0.75) iceSpeck = Math.max(iceSpeck, (1 - rn / 0.75) * 0.85);
            }
          }
          hVal = clamp01(hVal);
          let r = mix(62, 114, hVal);
          let g = mix(56, 102, hVal);
          let b = mix(52, 92, hVal);
          r = mix(r, 214, iceSpeck * 0.72);
          g = mix(g, 208, iceSpeck * 0.72);
          b = mix(b, 198, iceSpeck * 0.72);

          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'enceladus') {
        // Brilliant fresh water-ice albedo with pale cyan south-polar tiger stripes
        const n = new Noise3D(611);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const frost = n.fbm(sx * 5.0, sy * 5.0, sz * 5.0, 4) * 0.5 + 0.5;
          const southZone = smoothstep(-0.42, -0.82, sy);
          const stripe = smoothstep(0.09, 0.015, Math.abs(Math.sin((sx * 14 + sz * 11 + n.noise(sx * 4, sy * 4, sz * 4))))) * southZone;

          let r = mix(220, 248, frost);
          let g = mix(228, 252, frost);
          let b = mix(236, 255, frost);
          r = mix(r, 128, stripe * 0.75);
          g = mix(g, 196, stripe * 0.55);
          b = mix(b, 232, stripe * 0.35);

          const hVal = clamp01(0.55 + frost * 0.25 - stripe * 0.35);
          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'titan') {
        // Dense golden-amber hydrocarbon haze bands with subtle dark polar vortex hood
        const n = new Noise3D(621);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const swirl = n.fbm(sx * 2.6, sy * 6.5, sz * 2.6, 4) * 0.5 + 0.5;
          const band = Math.sin(sy * 8.0 + swirl * 1.4) * 0.5 + 0.5;
          const t = clamp01(band * 0.55 + swirl * 0.45);

          let r = mix(194, 238, t);
          let g = mix(132, 184, t);
          let b = mix(56, 94, t);

          const northHood = smoothstep(0.72, 0.96, sy);
          r = mix(r, 126, northHood * 0.6);
          g = mix(g, 108, northHood * 0.55);
          b = mix(b, 92, northHood * 0.45);

          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = 128; bmp[idx + 3] = 255;
        });
      } else if (moonId === 'triton') {
        // Pinkish-cream nitrogen frost cap + ridged cantaloupe terrain
        const n = new Noise3D(811);
        sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
          const cantaloupe = n.ridged(sx * 10.5, sy * 10.5, sz * 10.5, 3);
          const frost = smoothstep(-0.15, -0.65, sy + n.fbm(sx * 3.0, sy * 3.0, sz * 3.0, 3) * 0.28);
          const streak = smoothstep(0.68, 0.88, n.fbm(sx * 8.0, sy * 3.5, sz * 8.0, 3) * 0.5 + 0.5) * frost;

          let r = mix(154, 198, cantaloupe);
          let g = mix(138, 178, cantaloupe);
          let b = mix(134, 172, cantaloupe);

          // Pinkish nitrogen-methane polar frost
          r = mix(r, 232, frost * 0.78);
          g = mix(g, 206, frost * 0.78);
          b = mix(b, 202, frost * 0.78);

          // Dark cryovolcanic nitrogen geyser streaks
          r = mix(r, 92, streak * 0.65);
          g = mix(g, 84, streak * 0.65);
          b = mix(b, 86, streak * 0.65);

          const hVal = clamp01(cantaloupe * 0.65 + frost * 0.2);
          col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
          bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
        });
      }

      return {
        map: makeTexFromRGBA(col, w, h, true),
        bumpMap: makeTexFromRGBA(bmp, w, h, false)
      };
    }

    function buildMarsTextures() {
      const n = new Noise3D(404);
      const craters = makeCraters(55, 419);
      const w = 768, h = 384;
      const col = new Uint8ClampedArray(w * h * 4);
      const bmp = new Uint8ClampedArray(w * h * 4);

      sampleSpherePixels(w, h, (idx, sx, sy, sz) => {
        const lat = Math.abs(sy);
        const macro = n.fbm(sx * 2.1, sy * 2.1, sz * 2.1, 5) * 0.5 + 0.5;
        const fine = n.ridged(sx * 7.5, sy * 7.5, sz * 7.5, 4);
        let hVal = clamp01(macro * 0.72 + fine * 0.28);

        const canyon = Math.exp(-Math.pow((sy - 0.08) * 14, 2)) * smoothstep(0.2, 0.75, sx) * 0.38;
        hVal = clamp01(hVal - canyon);

        for (let i = 0; i < craters.length; i++) {
          const c = craters[i];
          const dx = sx - c.x, dy = sy - c.y, dz = sz - c.z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < c.rad * 1.35) {
            const rn = dist / c.rad;
            hVal += rn < 1.0 ? -(1 - rn * rn) * 0.22 * c.depth : Math.pow(1 - (rn - 1) / 0.35, 2) * 0.1 * c.depth;
          }
        }
        hVal = clamp01(hVal);

        let r = mix(118, 218, hVal);
        let g = mix(54, 114, hVal);
        let b = mix(34, 68, hVal);

        const polar = smoothstep(0.87, 0.94, lat + macro * 0.06);
        r = mix(r, 238, polar);
        g = mix(g, 232, polar);
        b = mix(b, 226, polar);

        col[idx] = r; col[idx + 1] = g; col[idx + 2] = b; col[idx + 3] = 255;
        bmp[idx] = bmp[idx + 1] = bmp[idx + 2] = hVal * 255; bmp[idx + 3] = 255;
      });

      return {
        map: makeTexFromRGBA(col, w, h, true),
        bumpMap: makeTexFromRGBA(bmp, w, h, false)
      };
    }

    function buildJupiterTextures() {
      const n = new Noise3D(505);
      const w = 1024, h = 512;
      const palette = [
        [226, 212, 188],
        [184, 128, 86],
        [236, 224, 204],
        [152, 96, 66],
        [214, 178, 140],
        [124, 92, 74],
        [232, 218, 196],
        [176, 118, 80]
      ];
      const map = createCanvasTex(w, h, (data, W, H) => {
        sampleSpherePixels(W, H, (idx, sx, sy, sz, u) => {
          const turb1 = n.fbm(sx * 3.8, sy * 9.5, sz * 3.8, 4) * 0.11;
          const turb2 = n.fbm(sx * 11.0 + turb1 * 4, sy * 22.0, sz * 11.0, 3) * 0.045;
          const latShift = clamp01((sy + 1) * 0.5 + turb1 + turb2);

          const bandPos = latShift * (palette.length - 1);
          const bi = Math.min(palette.length - 2, Math.floor(bandPos));
          const bf = smoothstep(0, 1, bandPos - bi);
          const c0 = palette[bi], c1 = palette[bi + 1];

          let r = mix(c0[0], c1[0], bf);
          let g = mix(c0[1], c1[1], bf);
          let b = mix(c0[2], c1[2], bf);

          const eddy = n.fbm(sx * 16.0, sy * 36.0 + turb1 * 18, sz * 16.0, 3) * 18;
          r += eddy; g += eddy * 0.8; b += eddy * 0.6;

          const dx = (u - 0.32) * 3.1;
          const dy = (sy + 0.36) * 5.8;
          const grsDist = Math.sqrt(dx * dx + dy * dy);
          if (grsDist < 0.45) {
            const swirlAng = (1.0 - grsDist / 0.45) * 4.5;
            const grsTex = n.noise(dx * 8 * Math.cos(swirlAng), dy * 8 * Math.sin(swirlAng), grsDist * 6) * 0.5 + 0.5;
            const wSpot = smoothstep(0.45, 0.14, grsDist);
            const core = smoothstep(0.28, 0.04, grsDist);
            r = mix(r, mix(198, 224, grsTex), wSpot);
            g = mix(g, mix(82, 108, grsTex) - core * 18, wSpot);
            b = mix(b, mix(56, 72, grsTex) - core * 14, wSpot);
          }

          const pole = smoothstep(0.76, 0.98, Math.abs(sy));
          r = mix(r, 118, pole * 0.65);
          g = mix(g, 116, pole * 0.55);
          b = mix(b, 124, pole * 0.4);

          data[idx] = clamp01(r / 255) * 255;
          data[idx + 1] = clamp01(g / 255) * 255;
          data[idx + 2] = clamp01(b / 255) * 255;
          data[idx + 3] = 255;
        });
      }, true);
      return { map };
    }

    function buildSaturnTextures() {
      const n = new Noise3D(606);
      const w = 768, h = 384;
      const map = createCanvasTex(w, h, (data, W, H) => {
        sampleSpherePixels(W, H, (idx, sx, sy, sz) => {
          const turb = n.fbm(sx * 3.0, sy * 12.0, sz * 3.0, 3) * 0.045;
          const y = sy + turb;
          const b1 = Math.sin(y * 24.0) * 0.5 + 0.5;
          const b2 = Math.sin(y * 11.0 + 1.2) * 0.5 + 0.5;
          const fine = n.fbm(sx * 9.0, sy * 28.0, sz * 9.0, 3) * 0.1;
          const t = clamp01(b1 * 0.45 + b2 * 0.45 + fine);

          let r = mix(178, 238, t);
          let g = mix(154, 214, t);
          let b = mix(112, 166, t);

          const pole = smoothstep(0.80, 0.98, Math.abs(sy));
          r = mix(r, 128, pole * 0.6);
          g = mix(g, 146, pole * 0.45);
          b = mix(b, 148, pole * 0.35);

          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        });
      }, true);

      const rw = 1024, rh = 8;
      const ringMap = createCanvasTex(rw, rh, (data, W, H) => {
        for (let x = 0; x < W; x++) {
          const r = x / (W - 1);
          let alpha = 0;
          let cr = 216, cg = 196, cb = 162;

          if (r > 0.04 && r < 0.24) {
            alpha = 0.22 * smoothstep(0.04, 0.1, r) * (0.7 + 0.3 * Math.sin(r * 240));
            cr = 152; cg = 140; cb = 126;
          } else if (r >= 0.24 && r < 0.61) {
            const fine = Math.sin(r * 520) * 0.12 + Math.sin(r * 190) * 0.15 + Math.cos(r * 920) * 0.08;
            alpha = clamp01(0.82 + fine);
            const warm = Math.sin(r * 95) * 0.5 + 0.5;
            cr = mix(205, 242, warm);
            cg = mix(184, 222, warm);
            cb = mix(148, 186, warm);
          } else if (r >= 0.61 && r < 0.675) {
            alpha = 0.04;
            cr = 90; cg = 84; cb = 78;
          } else if (r >= 0.675 && r < 0.92) {
            const encke = Math.abs(r - 0.855) < 0.011 ? 0.06 : 1.0;
            const fine = Math.sin(r * 460) * 0.12 + Math.cos(r * 810) * 0.08;
            alpha = clamp01((0.64 + fine) * encke * smoothstep(0.92, 0.89, r));
            cr = 198; cg = 184; cb = 160;
          } else if (r > 0.955 && r < 0.972) {
            alpha = 0.42;
            cr = 225; cg = 212; cb = 190;
          }

          for (let y = 0; y < H; y++) {
            const idx = (y * W + x) * 4;
            data[idx] = cr; data[idx + 1] = cg; data[idx + 2] = cb; data[idx + 3] = alpha * 255;
          }
        }
      }, true);

      return { map, ringMap };
    }

    function buildIceGiantTextures(isNeptune) {
      const n = new Noise3D(isNeptune ? 808 : 707);
      const w = 512, h = 256;
      const map = createCanvasTex(w, h, (data, W, H) => {
        sampleSpherePixels(W, H, (idx, sx, sy, sz, u) => {
          const turb = n.fbm(sx * 3.5, sy * 10.0, sz * 3.5, 4) * (isNeptune ? 0.1 : 0.035);
          const band = Math.sin((sy + turb) * (isNeptune ? 18.0 : 9.0)) * 0.5 + 0.5;
          const streak = n.fbm(sx * 12.0, sy * 24.0, sz * 12.0, 3) * 0.5 + 0.5;

          let r, g, b;
          if (isNeptune) {
            r = mix(28, 66, band * 0.6 + streak * 0.4);
            g = mix(64, 134, band * 0.6 + streak * 0.4);
            b = mix(178, 245, band * 0.6 + streak * 0.4);

            const wisp = smoothstep(0.72, 0.88, streak * (1.0 - Math.abs(sy) * 0.6));
            r = mix(r, 205, wisp * 0.65);
            g = mix(g, 228, wisp * 0.65);
            b = mix(b, 255, wisp * 0.65);

            const dx = (u - 0.55) * 4.0;
            const dy = (sy + 0.25) * 6.5;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < 0.35) {
              const s = smoothstep(0.35, 0.08, d);
              r = mix(r, 18, s * 0.75);
              g = mix(g, 38, s * 0.75);
              b = mix(b, 128, s * 0.65);
            }
          } else {
            r = mix(142, 198, band * 0.5 + streak * 0.5);
            g = mix(212, 238, band * 0.5 + streak * 0.5);
            b = mix(222, 246, band * 0.5 + streak * 0.5);
          }

          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        });
      }, true);
      return { map };
    }

    function createGlowTexture(innerColor, midColor, outerColor) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0.0, innerColor);
      g.addColorStop(0.22, midColor);
      g.addColorStop(0.55, outerColor);
      g.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    const SUN_VERT = `
      varying vec3 vNormal;
      varying vec3 vPos;
      varying vec3 vWorldPos;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPos = position;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const SUN_FRAG = `
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vPos;
      varying vec3 vWorldPos;

      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      float fbm(vec3 p) {
        float f = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 5; i++) {
          f += amp * snoise(p);
          p = p * 2.08 + vec3(0.0, uTime * 0.08, 0.0);
          amp *= 0.5;
        }
        return f;
      }

      void main() {
        vec3 p = normalize(vPos) * 3.4;
        float q = fbm(p + vec3(uTime * 0.06, -uTime * 0.04, uTime * 0.03));
        float r = fbm(p * 1.9 + vec3(q * 1.6) - vec3(uTime * 0.05));
        float gran = snoise(normalize(vPos) * 26.0 + vec3(uTime * 0.14)) * 0.15;

        float intensity = clamp(0.55 + r * 0.72 + gran, 0.0, 1.35);

        vec3 cDark   = vec3(0.58, 0.11, 0.01);
        vec3 cOrange = vec3(1.0, 0.42, 0.04);
        vec3 cGold   = vec3(1.0, 0.84, 0.36);
        vec3 cWhite  = vec3(1.0, 0.99, 0.92);

        vec3 col = mix(cDark, cOrange, smoothstep(0.08, 0.46, intensity));
        col = mix(col, cGold, smoothstep(0.42, 0.82, intensity));
        col = mix(col, cWhite, smoothstep(0.80, 1.22, intensity));

        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 worldN = normalize(vWorldPos);
        float ndv = clamp(dot(worldN, viewDir), 0.0, 1.0);
        float limb = pow(ndv, 0.42);
        col *= mix(0.72, 1.26, limb);
        col += vec3(1.0, 0.50, 0.14) * pow(1.0 - ndv, 3.2) * 0.95;

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // Custom Earth Day/Night/Specular/Twilight Shader
    const EARTH_VERT = `
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const EARTH_FRAG = `
      uniform sampler2D uDayMap;
      uniform sampler2D uNightMap;
      uniform sampler2D uSpecMap;
      uniform sampler2D uBumpMap;
      uniform float uAmbient;
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 L = normalize(-vWorldPos);
        vec3 V = normalize(cameraPosition - vWorldPos);

        float bC = texture2D(uBumpMap, vUv).r;
        float bX = texture2D(uBumpMap, vUv + vec2(0.0012, 0.0)).r;
        float bY = texture2D(uBumpMap, vUv + vec2(0.0, 0.0024)).r;
        vec3 dPdx = dFdx(vWorldPos);
        vec3 dPdy = dFdy(vWorldPos);
        vec3 nDx = dPdx / max(length(dPdx), 1e-5);
        vec3 nDy = dPdy / max(length(dPdy), 1e-5);
        vec3 surfGrad = nDx * (bC - bX) * 4.5 + nDy * (bC - bY) * 4.5;
        vec3 Nb = normalize(N + surfGrad * 0.35);

        float NdotL = dot(Nb, L);
        float dayFactor = smoothstep(-0.14, 0.22, NdotL);
        float diffuse = max(NdotL, 0.0);

        vec3 dayCol = texture2D(uDayMap, vUv).rgb;
        vec3 nightCol = texture2D(uNightMap, vUv).rgb;
        float specMask = texture2D(uSpecMap, vUv).r;

        vec3 H = normalize(L + V);
        float spec = pow(max(dot(Nb, H), 0.0), 42.0) * specMask * 0.85 * smoothstep(-0.02, 0.18, NdotL);

        float twilight = exp(-pow((NdotL + 0.02) * 8.5, 2.0));
        vec3 twilightTint = vec3(1.0, 0.36, 0.14) * twilight * 0.28;

        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.6);
        vec3 atmoRim = vec3(0.28, 0.62, 1.0) * fresnel * smoothstep(-0.2, 0.45, dot(N, L)) * 0.62;

        vec3 litEarth = dayCol * (diffuse * 1.18 + uAmbient) + vec3(1.0, 0.96, 0.88) * spec + twilightTint + atmoRim;

        float nightMask = smoothstep(0.08, -0.18, dot(N, L));
        vec3 darkEarth = dayCol * (uAmbient * 0.55) + nightCol * nightMask * 1.55;

        vec3 finalCol = mix(darkEarth, litEarth, dayFactor);
        gl_FragColor = vec4(finalCol, 1.0);
      }
    `;

    // BackSide Rayleigh Atmospheric Scattering Halo Shader
    // Uses side: THREE.BackSide and dot(-N, V) so the halo peaks smoothly along the outer planet limb
    // and fades to zero at the outer atmosphere boundary without washing out the front hemisphere.
    const ATMO_VERT = `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const ATMO_FRAG = `
      uniform vec3 uColor;
      uniform float uIntensity;
      uniform float uPower;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(-vWorldPos);
        float ndv = clamp(dot(-N, V), 0.0, 1.0);
        float rim = pow(clamp(ndv * 2.45, 0.0, 1.0), uPower);
        float sunSide = smoothstep(-0.30, 0.55, dot(N, L));
        float alpha = rim * sunSide * uIntensity;
        gl_FragColor = vec4(uColor * alpha * 1.25, alpha);
      }
    `;

    // Saturn Ring Shader with Analytical Spherical Planet Shadow

      varying vec3 vWorldPos;
      varying vec3 vLocalPos;
      void main() {
        vLocalPos = position;

    const RING_FRAG = `
      uniform sampler2D uRingMap;
      uniform float uInnerR;
      uniform float uOuterR;
      uniform vec3 uPlanetPos;
      uniform float uPlanetRadius;
      varying vec3 vWorldPos;
      varying vec3 vLocalPos;

      void main() {
        float dist = length(vLocalPos.xy);
        float u = (dist - uInnerR) / (uOuterR - uInnerR);
        if (u < 0.0 || u > 1.0) discard;

        vec4 tex = texture2D(uRingMap, vec2(u, 0.5));
        if (tex.a < 0.02) discard;

        vec3 toSun = normalize(-vWorldPos);
        vec3 oc = uPlanetPos - vWorldPos;
        float t = dot(oc, toSun);
        float shadow = 1.0;
        if (t > 0.0) {
          float d2 = dot(oc, oc) - t * t;
          float d = sqrt(max(d2, 0.0));
          shadow = smoothstep(uPlanetRadius * 0.94, uPlanetRadius * 1.03, d);
        }

        vec3 col = tex.rgb * mix(0.12, 1.15, shadow);
        gl_FragColor = vec4(col, tex.a * 0.94);
      }
    `;

    let starShaderMat = null;

    function createStarfield() {
      const group = new THREE.Group();

      const starCount = 10000;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);
      const sizes = new Float32Array(starCount);
      const phases = new Float32Array(starCount);

      const spectralPalette = [
        new THREE.Color(0x9bbcff),
        new THREE.Color(0xcad8ff),
        new THREE.Color(0xf8f7ff),
        new THREE.Color(0xfff4d6),
        new THREE.Color(0xffd2a1),
        new THREE.Color(0xffb584)
      ];

      for (let i = 0; i < starCount; i++) {
        const inBand = i < starCount * 0.45;
        const theta = Math.random() * Math.PI * 2;
        const phi = inBand
          ? Math.PI / 2 + (Math.random() - 0.5) * 0.44 * (Math.random() + 0.2)
          : Math.acos(2 * Math.random() - 1);
        const r = 1300 + Math.random() * 600;
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        const c = spectralPalette[Math.floor(Math.random() * spectralPalette.length)];
        const mag = Math.pow(Math.random(), 4.2);
        const brightness = 0.42 + mag * 1.15;
        colors[i * 3]     = c.r * brightness;
        colors[i * 3 + 1] = c.g * brightness;
        colors[i * 3 + 2] = c.b * brightness;

        sizes[i] = 1.6 + mag * 5.0;
        phases[i] = Math.random() * Math.PI * 2;
      }

      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      starGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      starShaderMat = new THREE.ShaderMaterial({
        uniforms: {
          uPixelRatio: { value: initPixelRatio },
          uTime: { value: 0 }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aPhase;
          uniform float uPixelRatio;
          uniform float uTime;
          varying vec3 vColor;
          varying float vTwinkle;
          void main() {
            vColor = aColor;
            vTwinkle = 0.86 + 0.14 * sin(uTime * 1.8 + aPhase);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPos;
            gl_PointSize = clamp(aSize * uPixelRatio, 1.5, 16.0);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vTwinkle;
          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            if (d > 0.5) discard;
            float core = exp(-d * d * 28.0);
            float halo = exp(-d * d * 6.0) * 0.42;
            float alpha = clamp((core + halo) * vTwinkle, 0.0, 1.0);
            vec3 col = mix(vColor, vec3(1.0), core * 0.65);
            gl_FragColor = vec4(col * alpha * 1.25, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const stars = new THREE.Points(starGeo, starShaderMat);
      stars.rotation.z = 0.48;
      stars.rotation.x = 0.22;
      stars.frustumCulled = false;
      group.add(stars);

      const nebNoise = new Noise3D(999);
      const nebTex = createCanvasTex(512, 256, (data, W, H) => {
        sampleSpherePixels(W, H, (idx, sx, sy, sz) => {
          const band = Math.exp(-Math.pow(sy * 3.6, 2));
          const dust = nebNoise.fbm(sx * 3.2, sy * 5.0, sz * 3.2, 4) * 0.5 + 0.5;
          const rift = smoothstep(0.38, 0.72, nebNoise.fbm(sx * 6.5, sy * 9.0, sz * 6.5, 3) * 0.5 + 0.5);
          const glow = band * dust * (1.0 - rift * 0.52);

          data[idx]     = clamp01(glow * 0.45 + band * 0.06) * 255;
          data[idx + 1] = clamp01(glow * 0.50 + band * 0.07) * 255;
          data[idx + 2] = clamp01(glow * 0.78 + band * 0.12) * 255;
          data[idx + 3] = 255;
        });
      }, true);

      const skyGeo = new THREE.SphereGeometry(2100, 32, 24);
      const skyMat = new THREE.MeshBasicMaterial({
        map: nebTex,
        side: THREE.BackSide,
        depthWrite: false,
        transparent: true,
        opacity: 0.52
      });
      const skyMesh = new THREE.Mesh(skyGeo, skyMat);
      skyMesh.rotation.z = 0.48;
      skyMesh.rotation.x = 0.22;
      group.add(skyMesh);

      scene.add(group);
      return group;
    }

    // =========================================================================
    // ASTEROID BELT & KUIPER BELT (GPU INSTANCED)
    // =========================================================================
    function createBelt(count, minR, maxR, ySpread, minSize, maxSize, colorHex, opacity = 1.0) {
      const geo = new THREE.DodecahedronGeometry(1, 0);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
        const f = 0.78 + Math.sin(vx * 7 + vy * 11 + vz * 5) * 0.22;
        pos.setXYZ(i, vx * f, vy * f, vz * f);
      }
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.92,
        metalness: 0.12,
        transparent: opacity < 1,
        opacity
      });

      const mesh = new THREE.InstancedMesh(geo, mat, count);
      const dummy = new THREE.Object3D();
      const col = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = minR + Math.random() * (maxR - minR);
        const y = (Math.random() - 0.5) * ySpread;
        dummy.position.set(Math.cos(ang) * rad, y, Math.sin(ang) * rad);
        dummy.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
        const s = minSize + Math.pow(Math.random(), 2.4) * (maxSize - minSize);
        dummy.scale.set(s * (0.7 + Math.random() * 0.6), s * (0.6 + Math.random() * 0.6), s);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);

        const shade = 0.55 + Math.random() * 0.55;
        col.setHex(colorHex).multiplyScalar(shade);
        mesh.setColorAt(i, col);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);
      return mesh;
    }

    function createComet() {
      const group = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.32, 1),
        new THREE.MeshStandardMaterial({ color: 0xbde6ff, roughness: 0.7, emissive: 0x3b88c3, emissiveIntensity: 0.45 })

      const coma = new THREE.Sprite(new THREE.SpriteMaterial({
        map: comaTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      coma.scale.set(3.2, 3.2, 1);
      group.add(coma);

      const tailGeo = new THREE.ConeGeometry(1.15, 16, 16, 1, true);
      tailGeo.translate(0, 8, 0);
      tailGeo.rotateX(Math.PI / 2);
      const tailMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          varying float vAlong;
          void main() {
            vAlong = clamp(position.z / 16.0, 0.0, 1.0);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying float vAlong;
          void main() {
            float fade = pow(1.0 - vAlong, 2.2) * smoothstep(0.0, 0.08, vAlong);
            vec3 col = mix(vec3(0.75, 0.94, 1.0), vec3(0.22, 0.56, 1.0), vAlong);
            gl_FragColor = vec4(col, fade * 0.48);
          }
        `
      });
      const tail = new THREE.Mesh(tailGeo, tailMat);
      group.add(tail);

      scene.add(group);
      return { group, tail, angle: 0.8 };
    }

    async function buildSolarSystem() {
      setLoad(8, 'Generating Deep Space Starfield & Milky Way...');
      await yieldFrame();
      createStarfield();

      setLoad(16, 'Igniting Solar Photosphere & Corona...');
      await yieldFrame();

      const sunCfg = BODIES[0];

      setLoad(28, 'Sculpting Mercury & Venus...'); await yieldFrame();
